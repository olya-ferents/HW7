  <title id="title">B2: first-call input tokens by step</title>
  <desc id="desc">Per-step medians of five runs per profile. Clean: 2627, 3458, 3904, 4791, 5580, 5683, 5765. Lesson-08: 2627, 3922, 4646, 6097, 7479, 7567, 7654. Step-six threshold: 6500.</desc>
